<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Killer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1><span class="highlight">Tab</span> Killer</h1>
      <p class="subtitle">End of day cleanup.</p>
      <div class="header-actions">
        <button id="restore-session-btn" class="action-btn keep-btn">Restore Last Session</button>
      </div>
    </header>

    <!-- VIEW 1: Summary / End Day Flow (Default) -->
    <div id="summary-view" class="view-section">
      <div class="summary-panel">
        <div class="stat-box">
          <span class="stat-val" id="stat-total">0</span>
          <span class="stat-label">Total Tabs</span>
        </div>
        <div class="stat-box warning">
          <span class="stat-val" id="stat-dupes">0</span>
          <span class="stat-label">Duplicates</span>
        </div>
        <div class="stat-box muted">
          <span class="stat-val" id="stat-inactive">0</span>
          <span class="stat-label">Inactive</span>
        </div>
        <div class="stat-box info">
          <span class="stat-val" id="stat-groups">0</span>
          <span class="stat-label">Groups</span>
        </div>
      </div>

      <div class="human-centered-stats" style="text-align: center; margin-bottom: 1.5rem; font-size: 0.85rem; color: var(--text-secondary);">
        <p id="stale-tabs-msg" style="margin-bottom: 0.25rem;">0 tabs haven't been used in a while.</p>
        <p id="impact-msg" style="color: var(--text-primary); font-size: 0.95rem;">You will close <strong class="danger" id="stat-to-close">0</strong> tabs and keep <strong class="success" id="stat-to-keep">0</strong>.</p>
      </div>

      <div class="smart-actions">
        <button id="btn-auto-clean" class="smart-btn primary-btn">
          <div class="btn-title">Auto Clean</div>
          <div class="btn-desc">Close duplicates & inactive</div>
        </button>
        <button id="btn-save-close" class="smart-btn accent-btn">
          <div class="btn-title">Save All & Close</div>
          <div class="btn-desc">Save session, close all unpinned</div>
        </button>
        <button id="btn-review" class="smart-btn secondary-btn">
          <div class="btn-title">Review Tabs</div>
          <div class="btn-desc">Manually select tabs</div>
        </button>
        <button id="btn-view-saved-home" class="smart-btn secondary-btn" style="margin-top: 0.5rem;">
          <div class="btn-title">Open Session Vault</div>
        </button>
      </div>
    </div>

    <!-- VIEW 2: Review Tabs -->
    <div id="review-view" class="view-section hidden">
      <div class="tabs-header">
        <button class="text-btn back-to-home-btn">← Back</button>
        <h2 id="current-tabs-title">Review (<span id="tab-count">0</span>)</h2>
        <label class="select-all-label">
          <input type="checkbox" id="select-all-tabs" class="custom-checkbox">
          Select All
        </label>
      </div>
      
      <!-- Container for grouped tabs -->
      <div id="grouped-tab-list" class="grouped-tab-list">
        <div class="loading-state">Analyzing tabs...</div>
      </div>

      <!-- Selection Action Bar -->
      <div id="selection-bar" class="selection-bar hidden">
        <span id="selection-count-text">0 selected</span>
        <div class="selection-actions">
          <select id="group-select" class="group-select">
            <option value="new">+ New Group</option>
          </select>
          <button id="btn-save-selected" class="action-btn open-btn" style="flex: none; padding: 0.5rem 1rem;">Save</button>
        </div>
      </div>
    </div>

    <!-- VIEW 3: Saved Tabs -->
    <div id="saved-tabs-section" class="view-section hidden">
      <div class="tabs-header">
        <button class="text-btn back-to-home-btn">← Back</button>
        <h2>Session Vault</h2>
      </div>
      <ul id="saved-tab-list" class="tab-list">
        <!-- Saved tab cards will be injected here -->
      </ul>
      <button id="clear-saved-btn" class="action-btn danger-btn hidden" style="margin-top: 1rem; width: 100%;">Clear Vault</button>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
